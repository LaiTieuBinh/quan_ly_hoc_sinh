services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quan_ly_hoc_sinh
      POSTGRES_USER: qlhs_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlhs_user -d quan_ly_hoc_sinh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

